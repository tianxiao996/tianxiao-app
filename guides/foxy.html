<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>foxy 资源解压教学</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;min-height:500px;display:flex;flex-direction:column;font:14px/1.6 "Microsoft YaHei",sans-serif;background:#252929;color:#eee}button,input{font:inherit}button{cursor:pointer;border:1px solid #606866;border-radius:7px;background:#3a403f;color:#eee;padding:8px 12px}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #eee;outline-offset:2px}header{background:#1c1f1e;padding:12px 16px;border-bottom:1px solid #454c49;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{margin-right:auto}#desktop{flex:1;min-height:160px;padding:24px;display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:18px;overflow:auto}.file{width:130px;border:1px solid transparent;background:transparent;padding:12px 6px;text-align:center;overflow-wrap:anywhere}.file.selected{background:#424b47;border-color:#81908a}.file svg{display:block;width:48px;height:48px;margin:0 auto 10px;color:#cdd9d2}.file input{width:100%;padding:4px;background:#fff;color:#222;border:1px solid #aaa;border-radius:3px}.task{background:#1c1f1e;padding:18px;border-top:1px solid #454c49}.task p{margin:8px 0}.task strong{color:#e8efeb}small{color:#b9c2bc}#toast{color:#f2d3b1}dialog{background:#343b37;color:#eee;border:2px solid #141916;border-radius:14px;padding:24px;max-width:calc(100% - 24px);width:420px}dialog::backdrop{background:rgba(0,0,0,.6)}dialog h2{font-size:18px;margin-top:0}dialog input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #6c7971;border-radius:7px;background:#202621;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#f2b8ac;min-height:24px}#progress{width:100%}@media(max-width:500px){header{padding:10px}.task{padding:14px}#desktop{padding:16px;gap:10px}.file{width:118px}.task p{font-size:13px}}
</style></head><body><header><strong>foxy 资源解压教学</strong><button id="renameBtn" onclick="startRename()" disabled>重命名</button><button id="extractBtn" onclick="extractSelected()" disabled>解压</button><button onclick="showHint()">提示</button></header><main id="desktop" aria-label="模拟文件夹"></main><section class="task"><strong id="step"></strong><p id="task"></p><small>JPG 和 PNG 两个文件都要下载，并放在同一文件夹。打开“文件扩展名”后再修改后缀；两份文件同名，仅扩展名不同。</small><p id="toast" role="status"></p></section><dialog id="passwordDialog"><form onsubmit="checkPassword(event)"><h2 id="passwordTitle">输入解压密码</h2><p id="passwordHelp"></p><label for="passwordInput">解压密码</label><input id="passwordInput" autocomplete="off" required><p class="error" id="passwordError" role="status"></p><div class="actions"><button type="submit">开始解压</button><button type="button" onclick="document.getElementById('passwordDialog').close()">取消</button></div></form></dialog><dialog id="extractDialog"><h2>正在解压</h2><progress id="progress" max="100" value="0"></progress><p id="extractText"></p></dialog><dialog id="doneDialog"><h2>解压教学完成</h2><p>你已经掌握了 JPG / PNG 分卷改名与两层密码解压。</p><p>第一层密码：foxyfoxy<br>第二层密码：@xinkongkafei</p><button onclick="location.reload()">再练习一次</button><button onclick="this.parentElement.close()">关闭</button></dialog><script>
let stage=1,selected=null,renaming=null,busy=false;
let files=[{id:1,name:'F100.jpg'},{id:2,name:'F100.png'}];
const icon='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4h20l8 8v32H10zM30 4v10h8M16 23h16M16 30h16M16 37h10"/></svg>';
const tasks={1:'把 F100.jpg 改为 F100.001，把 F100.png 改为 F100.002。选中文件后点击“重命名”，回车或失焦确认。',2:'分卷已经准备好。选中 F100.001 后点击“解压”，第一层密码是 foxyfoxy。',3:'打开解压出的 F100.7z，再次解压。第二层密码（即二层秘密）是 @xinkongkafei。',4:'教程完成。点击“完成教学.txt”查看你学会的步骤。'};
function render(){const desktop=document.getElementById('desktop');desktop.replaceChildren();for(const f of files){const button=document.createElement('button');button.type='button';button.className='file'+(selected===f.id?' selected':'');button.dataset.id=f.id;button.innerHTML=icon;if(renaming===f.id){const input=document.createElement('input');input.value=f.name;input.setAttribute('aria-label','文件名');button.appendChild(input);let committed=false;const commit=()=>{if(committed)return;committed=true;renameFile(f.id,input.value.trim())};input.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();commit()}if(e.key==='Escape'){committed=true;renaming=null;render()}});input.addEventListener('blur',commit);setTimeout(()=>{input.focus();input.select()},0)}else{const label=document.createElement('span');label.textContent=f.name;button.appendChild(label);button.onclick=()=>{selected=f.id;if(stage===4)document.getElementById('doneDialog').showModal();else render()};button.ondblclick=()=>{selected=f.id;if(stage===1)startRename();else extractSelected()}}desktop.appendChild(button)}document.getElementById('renameBtn').disabled=!selected||busy||stage!==1;document.getElementById('extractBtn').disabled=!selected||busy||stage===1||stage===4;document.getElementById('step').textContent=stage<4?'第 '+stage+' / 3 步':'教程完成';document.getElementById('task').textContent=tasks[stage]}
function startRename(){if(!selected||busy)return;renaming=selected;render()}
function renameFile(id,name){renaming=null;const f=files.find(f=>f.id===id);if(!f||!name){render();return}if(files.some(x=>x.id!==id&&x.name===name)){tell('两个分卷的完整文件名不能相同。');render();return}f.name=name;if(files.some(x=>x.name==='F100.001')&&files.some(x=>x.name==='F100.002')){stage=2;tell('两份分卷准备好了。')}else tell('目标文件名为 F100.001 和 F100.002，请注意扩展名。');render()}
function tell(message){document.getElementById('toast').textContent=message}
function showHint(){tell(tasks[stage])}
function extractSelected(){if(busy)return;const f=files.find(f=>f.id===selected);if(!f)return;if(stage===2&&f.name!=='F100.001'){tell('请选择第一个分卷 F100.001，第二个分卷会自动一起读取。');return}if(stage===3&&f.name!=='F100.7z'){tell('请选择刚解压出的 F100.7z。');return}if(![2,3].includes(stage))return;document.getElementById('passwordTitle').textContent=stage===2?'第一层解压密码':'第二层解压密码';document.getElementById('passwordHelp').textContent=stage===2?'解压码：foxyfoxy':'二层秘密：@xinkongkafei';document.getElementById('passwordInput').value='';document.getElementById('passwordError').textContent='';document.getElementById('passwordDialog').showModal();document.getElementById('passwordInput').focus()}
function checkPassword(event){event.preventDefault();const expected=stage===2?'foxyfoxy':'@xinkongkafei';if(document.getElementById('passwordInput').value!==expected){document.getElementById('passwordError').textContent='密码不正确，请按教程提示重新输入。';return}document.getElementById('passwordDialog').close();busy=true;render();const dialog=document.getElementById('extractDialog'),progress=document.getElementById('progress');progress.value=0;dialog.showModal();let p=0;const timer=setInterval(()=>{p+=10;progress.value=p;document.getElementById('extractText').textContent=p+'%';if(p>=100){clearInterval(timer);dialog.close();busy=false;if(stage===2){files.push({id:3,name:'F100.7z'});stage=3;selected=3;tell('第一层解压成功，请继续解压 F100.7z。')}else{files.push({id:4,name:'完成教学.txt'});stage=4;selected=4;tell('两层解压已完成。');document.getElementById('doneDialog').showModal()}render()}},100)}
render();
</script></body></html>
