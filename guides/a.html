<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解压小教学 · HTML 小游戏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1b2432;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ===== 顶栏 ===== */
  #topbar {
    height: 46px; background:#111827;
    display:flex; align-items:center; padding:0 16px;
    color:#9ca3af; font-size:13px; gap:10px;
    border-bottom:1px solid #263043;
  }
  #topbar .dot { width:11px;height:11px;border-radius:50%; }
  .dot.r{background:#f5655b;} .dot.y{background:#f6bd4f;} .dot.g{background:#43c465;}
  #topbar b { color:#e5e7eb; font-size:14px; }

  /* ===== 桌面 ===== */
  #desktop {
    flex:1; position:relative; padding:26px;
    background:
      radial-gradient(1200px 600px at 70% -10%, #2c3e5c 0%, transparent 60%),
      linear-gradient(160deg,#1e293b 0%, #16202e 100%);
  }

  #desktop { display:flex; flex-wrap:wrap; gap:14px; align-content:flex-start; }
  .file {
    width:96px; padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    border-radius:10px; cursor:pointer;
    border:1.5px solid transparent;
    transition: transform .15s;
  }
  .file:hover { background:rgba(255,255,255,.06); }
  .file.selected { background:rgba(96,165,250,.18); border-color:#60a5fa; }
  .file.hint { animation: shake .5s ease 3; border-color:#fbbf24; }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}
  }
  .file.pop { animation: pop .5s ease; }
  @keyframes pop {
    0%{transform:scale(0) rotate(-15deg); opacity:0;}
    70%{transform:scale(1.15) rotate(4deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .file .icon { font-size:42px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .file .name {
    font-size:12px; color:#e5e7eb; text-align:center;
    word-break:break-all; line-height:1.35; max-width:92px;
    background:rgba(0,0,0,.35); padding:2px 6px; border-radius:5px;
  }
  .file .name-input {
    width:92px; font-size:12px; padding:3px 5px; text-align:center;
    border:1.5px solid #60a5fa; border-radius:5px; outline:none;
    background:#0f172a; color:#fff;
  }

  /* ===== 工具栏 ===== */
  #toolbar {
    position:absolute; top:16px; right:20px;
    display:flex; gap:8px; z-index:5;
  }
  .tbtn {
    padding:8px 16px; border:none; border-radius:8px;
    background:#334155; color:#e2e8f0; font-size:13px; cursor:pointer;
    transition:.15s;
  }
  .tbtn:hover:not(:disabled) { background:#475569; transform:translateY(-1px); }
  .tbtn:disabled { opacity:.35; cursor:not-allowed; }

  /* ===== 底部提示面板 ===== */
  #guide {
    background:#0f172a; border-top:1px solid #263043;
    padding:14px 20px 16px; min-height:96px;
    display:flex; gap:14px; align-items:flex-start;
  }
  #mascot { font-size:38px; animation: bounce 2s infinite ease-in-out; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  #step-tag {
    display:inline-block; font-size:11px; color:#93c5fd;
    border:1px solid #3b82f6; border-radius:20px; padding:1px 10px;
    margin-bottom:5px;
  }
  #task-text { color:#f1f5f9; font-size:15px; line-height:1.6; }
  #task-text .hl { color:#fbbf24; font-weight:bold; }

  /* ===== 解压弹窗 ===== */
  .overlay {
    position:fixed; inset:0; background:rgba(2,6,23,.7);
    display:flex; align-items:center; justify-content:center; z-index:50;
    backdrop-filter: blur(2px);
  }
  .modal {
    width:340px; background:#1e293b; border:1px solid #334155;
    border-radius:14px; padding:26px 26px 22px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal .m-icon { font-size:56px; animation: spinzip 1.2s infinite ease-in-out; }
  @keyframes spinzip { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18) rotate(-6deg);} }
  .modal h3 { color:#f8fafc; margin:12px 0 4px; font-size:17px; }
  .modal p  { color:#94a3b8; font-size:12px; margin-bottom:16px; }
  .pbar-wrap { height:10px; background:#0f172a; border-radius:6px; overflow:hidden; }
  .pbar { height:100%; width:0%; border-radius:6px;
    background:linear-gradient(90deg,#3b82f6,#22d3ee); transition:width .12s; }
  #pbar-text { color:#60a5fa; font-size:12px; margin-top:8px; font-family:monospace; }

  /* ===== 通关 ===== */
  #txt-content {
    width:380px; max-width:85vw; text-align:center;
  }
  #txt-content .big { font-size:44px; margin-bottom:10px; }
  #txt-content h2 { color:#fbbf24; margin-bottom:12px; }
  #txt-content pre {
    text-align:left; background:#0f172a; border-radius:10px;
    padding:16px; color:#86efac; font-size:13px; line-height:1.8;
    white-space:pre-wrap; margin-bottom:18px;
  }
  .restart {
    padding:10px 28px; border:none; border-radius:8px; cursor:pointer;
    background:linear-gradient(90deg,#3b82f6,#6366f1); color:#fff; font-size:15px;
  }
  .restart:hover { filter:brightness(1.15); }

  .confetti { position:fixed; top:-40px; z-index:99; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity:.7; } }
</style>
</head>

</div>

function addFile(name, icon) {
  const f = { id: ++uid, name, icon };
  files.push(f);
  renderFiles();
  const el = desktop.querySelector(`[data-id="${f.id}"]`);
  if (el) el.classList.add('pop');
  return f;
}

function renderFiles() {
  desktop.querySelectorAll('.file').forEach(e => e.remove());
  files.forEach(f => {
    const el = document.createElement('div');
    el.className = 'file' + (f.id === selectedId ? ' selected' : '');
    el.dataset.id = f.id;
    if (renamingId === f.id) {
      el.innerHTML = `<div class="icon">${f.icon}</div>
        <input class="name-input" value="${f.name}" spellcheck="false">`;
      const inp = el.querySelector('input');
      inp.focus(); inp.select();
      const commit = () => commitRename(f.id, inp.value.trim());
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { renamingId = null; renderFiles(); }
        e.stopPropagation();
      });
      inp.addEventListener('blur', commit);
      inp.addEventListener('dblclick', e => e.stopPropagation());
    } else {
      el.innerHTML = `<div class="icon">${f.icon}</div><div class="name">${f.name}</div>`;
      el.addEventListener('click', e => { e.stopPropagation(); selectFile(f.id); });
      el.addEventListener('dblclick', e => {
        e.stopPropagation();
        selectFile(f.id);
        onDoubleClick(f);
      });
    }
    desktop.appendChild(el);
  });
  updateToolbar();
}

function selectFile(id) {
  if (renamingId) return;
  selectedId = id;
  renderFiles();
}

function updateToolbar() {
  const f = files.find(x => x.id === selectedId);
  btnRename.disabled = !f || renamingId !== null;
  btnExtract.disabled = !f || renamingId !== null;
}

desktop.addEventListener('click', () => {
  if (renamingId) return;
  selectedId = null;
  renderFiles();
});

btnRename.addEventListener('click', () => {
  if (selectedId) { renamingId = selectedId; renderFiles(); }
});

btnExtract.addEventListener('click', () => {
  const f = files.find(x => x.id === selectedId);
  if (f) tryExtract(f);
});

function onDoubleClick(f) {
  if (f.name === '你已经完成教学.txt') { showTxtModal(); return; }
  if (/\.(001|7z)$/.test(f.name)) tryExtract(f);
  else { renamingId = f.id; renderFiles(); }
}

/* ================= 重命名与校验 ================= */
function commitRename(id, newName) {
  if (renamingId !== id) return;
  renamingId = null;
  const f = files.find(x => x.id === id);
  if (!f || !newName) { renderFiles(); return; }

  const old = f.name;
  if (newName === old) { renderFiles(); return; }
  if (files.some(x => x !== f && x.name === newName)) {
    toast(`已存在同名文件「${newName}」`, '⚠️');
    renderFiles(); return;
  }
  f.name = newName;
  renderFiles();

  /* 分阶段引导 */
  if (stage === 1) {
    const ok1 = /^(A100\.)?7z\.001$/.test(newName);
    const ok2 = /^(A100\.)?7z\.002$/.test(newName);
    if (old === 'A100.bin' && !ok1)
      toast('提示：A100.bin 应该改名为 A100.7z.001 哦', '💡');
    if (old === 'A100.db' && !ok2)
      toast('提示：A100.db 应该改名为 A100.7z.002 哦', '💡');
    const v1 = files.find(x => /^(A100\.)?7z\.001$/.test(x.name));
    const v2 = files.find(x => /^(A100\.)?7z\.002$/.test(x.name));
    if (v1 && v2) nextStage();
  }
  else if (stage === 3 && old === 'A2.bin') {
    if (newName !== 'A2.7z') toast('提示：应改名为 A2.7z', '💡');
  }
  else if (stage === 4 && old === 'A1.bin') {
    if (newName !== 'A1.7z') toast('提示：应改名为 A1.7z', '💡');
  }
}

function has(name) { return files.some(f => f.name === name); }

/* ================= 解压 ================= */
function tryExtract(f) {
  let expect = stages[stage] && stages[stage].extractTarget;
  if (stage === 2) {
    const v = files.find(x => /^(A100\.)?7z\.001$/.test(x.name));
    if (v) expect = v.name; else expect = 'A100.7z.001';
  }
  if (!expect) { toast('请修改正确的分卷后缀', '🐱'); return; }
  if (f.name !== expect) {
    toast(`现在要解压的是「${expect}」，不是它`, '⚠️');
    return;
  }
  showExtractAnim(f.name, () => {
    if (stage === 2) {
      addFile('A2.bin', '📦');
      nextStage();
    } else if (stage === 3) {
      addFile('A1.bin', '📦');
      nextStage();
    } else if (stage === 4) {
      addFile('你已经完成教学.txt', '📄');
      setTimeout(win, 600);
    }
  });
}

function showExtractAnim(archiveName, onDone) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="m-icon">📦</div>
      <h3>正在解压 ${archiveName}</h3>
      <p>解压中… 请不要关闭窗口 ⏳（约 3 秒）</p>
      <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
      <div id="pbar-text">0%</div>
    </div>`;
  document.body.appendChild(overlay);
  const bar = overlay.querySelector('#pbar');
  const txt = overlay.querySelector('#pbar-text');
  let p = 0;
  const timer = setInterval(() => {
    p += 2 + Math.random() * 4;
    if (p >= 100) {
      p = 100; clearInterval(timer);
      txt.textContent = '100% — 解压完成！';
      setTimeout(() => { overlay.remove(); onDone(); }, 500);
    }
    bar.style.width = p + '%';
    txt.textContent = Math.floor(p) + '%';
  }, 100);
}

/* ================= 提示按钮 ================= */
const hintMsgs = {
  1: '把 A100.bin 改成 A100.7z.001，把 A100.db 改成 A100.7z.002',
  2: '双击 A100.7z.001 开始解压',
  3: '把 A2.bin 改名为 A2.7z，然后解压',
  4: '把 A1.bin 改名为 A1.7z，然后解压',
  5: '双击打开「你已经完成教学.txt」'
};
const hintPatterns = {
  1: [/^A100\.bin$/, /^A100\.db$/],
  2: [/7z\.001$/],
  3: [/^A2\.bin$/, /^A2\.7z$/],
  4: [/^A1\.bin$/, /^A1\.7z$/],
  5: [/完成教学\.txt$/]
};
document.getElementById('btn-hint').addEventListener('click', () => {
  let hit = false;
  files.forEach(f => {
    if ((hintPatterns[stage] || []).some(re => re.test(f.name))) {
      const el = desktop.querySelector(`[data-id="${f.id}"]`);
      if (el) { el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); hit = true; }
    }
  });
  toast(hintMsgs[stage] || '按底部说明操作即可', '💡');
});

/* ================= 提示气泡 ================= */
let toastTimer = null;
function toast(msg, icon) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = `position:fixed; top:60px; left:50%; transform:translateX(-50%);
      background:#f59e0b; color:#111827; font-size:14px; font-weight:bold;
      padding:10px 22px; border-radius:24px; z-index:100;
      box-shadow:0 6px 20px rgba(0,0,0,.4); transition:opacity .3s;`;
    document.body.appendChild(t);
  }
  t.textContent = `${icon || '💡'} ${msg}`;
  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, 2200);
}

/* ================= 流程控制 ================= */
function nextStage() {
  stage++;
  if (stages[stage]) setTask();
}

function setTask() {
  const s = stages[stage];
  stepTag.textContent = s.tag;
  taskText.innerHTML = s.html;
}

function win() {
  stage = 5;
  stepTag.textContent = '🎉 教程完成';
  taskText.innerHTML = '恭喜你！双击打开 <span class="hl">你已经完成教学.txt</span> 看看吧！';
  confetti();
}

/* 双击最终的 txt 查看内容 */
const origDbl = onDoubleClick;
function bindTxt() {
  files.filter(f => f.name === '你已经完成教学.txt').forEach(f => {
    const el = desktop.querySelector(`[data-id="${f.id}"]`);
    if (el && !el.dataset.txtBound) {
      el.dataset.txtBound = 1;
      el.addEventListener('dblclick', e => {
        e.stopPropagation();
        showTxtModal();
      });
    }
  });
}
setInterval(bindTxt, 500);

function showTxtModal() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" id="txt-content">
      <div class="big">🎉</div>
      <h2>你已经完成教学！</h2>
      <pre>尊敬的用户：
  您已成功完成本次解压教学！

  掌握的技能：
  ✔ 文件重命名（.bin / .db → .001 / .002）
  ✔ 分卷压缩包解压
  ✔ 多层压缩包逐层解压

  感谢您的参与，教学结束。</pre>
      <button class="restart" id="btn-restart">🔄 再玩一次</button>
    </div>`;
  document.body.appendChild(overlay);
  confetti();
  overlay.querySelector('#btn-restart').addEventListener('click', () => location.reload());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

/* ================= 彩带 ================= */
function confetti() {
  const emo = ['🎉','✨','🎊','⭐','💐','🟡','🔵'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = emo[Math.floor(Math.random() * emo.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    s.style.fontSize = 14 + Math.random() * 20 + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }
}

/* ================= 初始化 ================= */
addFile('A100.bin', '📦');
addFile('A100.db', '🗃️');
setTask();
</script>
