<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://api.tian-xiao.com blob:; connect-src 'self' https://api.tian-xiao.com; object-src 'none'; base-uri 'self'; form-action 'none'"><title>游戏投票 · 天笑の窝</title><link rel="icon" href="assets/site-icons/cat-face-e758088f6eb0.svg" type="image/svg+xml"><link rel="stylesheet" href="polls.css?v=1cf1d42735893019"><script src="polls.js?v=18d55abdd3a3cf4b" defer></script></head>
<body><header><a href="./">返回网站</a><h1>游戏投票</h1><div class="header-actions"><span id="accountName">正在读取账号</span><button id="theme" type="button">日夜模式</button></div></header><main>
<p id="status" role="status" aria-live="polite"></p><p id="loginHint" hidden>登录后可以投稿和投票。<a href="./">返回网站登录</a></p>
<div class="intro"><div><p class="eyebrow">一起决定，下一款玩什么</p><h2>把想玩的游戏带上来</h2><p>管理员开启活动，每人投稿一款游戏，配上1–4张图片。投票可设为单选或多选，具体规则由每次活动决定。</p></div><button id="newPoll" type="button" hidden>发起投票</button></div>
<form id="createForm" class="panel" hidden><h2>发起游戏投票</h2><label>投票标题<input id="pollTitle" maxlength="120" required></label><label>活动说明<textarea id="pollDescription" maxlength="2000" rows="3"></textarea></label><label>可投稿人数<input id="pollLimit" type="number" min="1" max="500" value="20" required></label><div class="rules-slot"></div><p class="hint">每位登录用户可投稿一款游戏。先征集投稿，由管理员决定何时开始投票。</p><div class="actions"><button type="submit" id="createSubmit">创建并开放投稿</button><button id="cancelCreate" type="button">取消</button></div></form>
<div class="workspace"><aside><h2>投票活动</h2><button id="reloadList" type="button">刷新活动</button><div id="pollList"></div></aside><section id="detail" aria-live="polite"><div class="empty">选择一个投票活动查看。</div></section></div>
</main>
<template id="rulesTemplate"><fieldset class="vote-rules"><legend>投票规则</legend><label>选择方式<select name="choiceMode"><option value="single">单选</option><option value="multiple">多选</option></select></label><div class="choice-bounds" hidden><label>最少选择几款<input name="minChoices" type="number" min="1" max="500" value="1" required></label><label>最多选择几款<input name="maxChoices" type="number" min="1" max="500" value="1" required></label></div><label class="check-label"><input name="allowChange" type="checkbox" checked>允许改投或撤回</label><label>结果公开时机<select name="resultsVisibility"><option value="always">始终公开</option><option value="after_vote">投票后可见，结束后公开</option><option value="after_close">结束后公开</option></select></label><label>投票截止时间（本地时间，可留空）<input name="endsAt" type="datetime-local"></label><p class="rules-lock hint" hidden>已有用户投票，选择数量、改投和结果公开规则已锁定；仍可调整截止时间或结束活动。</p></fieldset></template>
<template id="detailTemplate"><div class="poll-heading"><div><span class="phase"></span><h2 class="title"></h2><p class="description"></p><p class="meta"></p><p class="rule-summary"></p><p class="deadline" role="status"></p></div><button class="reload" type="button">刷新</button></div>
<form class="manage panel" hidden><h3>管理投票</h3><label>可投稿人数<input name="limit" type="number" min="1" max="500" required></label><label>当前阶段<select name="phase"><option value="submission">征集投稿</option><option value="voting">开放投票</option><option value="closed">已结束</option></select></label><div class="rules-slot"></div><p class="hint">开始投票时，候选游戏数须达到最少选择数量。已有投票后不能重开投稿；结束后可重新开放投票。</p><button type="submit">保存投票设置</button></form>
<form class="nominate panel" hidden><h3>投稿一款游戏</h3><label>游戏名称<input name="title" maxlength="120" required></label><label>游戏图片（1–4张）<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="submission-previews"></div><p class="image-count hint">已选0/4张，可分次添加</p><p class="hint">支持JPG、PNG、WebP，每张自动压缩上传，保持原始比例。每人一款，同名游戏不能重复投稿。</p><button type="submit">提交游戏</button></form>
<p class="participation"></p><p class="result-notice hint"></p><form class="vote-form"><div class="entries"></div><div class="ballot-actions" hidden><p class="selection-count" role="status"></p><div class="actions"><button class="submit-ballot" type="submit">提交投票</button><button class="withdraw-ballot" type="button" hidden>撤回投票</button></div><p class="hint">勾选后点击“提交投票”才会记录。</p></div></form></template>
<dialog id="imageDialog" aria-label="游戏图片预览"><div class="image-dialog-heading"><span id="imageCaption"></span><button id="closeImage" type="button" aria-label="关闭图片预览">×</button></div><img id="largeImage" alt=""><div class="image-navigation"><button id="previousImage" type="button">上一张</button><button id="nextImage" type="button">下一张</button></div></dialog>
</body></html>
