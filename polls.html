<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://api.tian-xiao.com blob:; connect-src 'self' https://api.tian-xiao.com; object-src 'none'; base-uri 'self'; form-action 'none'"><title>游戏投票 · 天笑の窝</title><link rel="icon" href="assets/site-icons/cat-face-e758088f6eb0.svg" type="image/svg+xml"><link rel="stylesheet" href="polls.css?v=ce3692a36e5aca73"><script src="polls.js?v=36f1f62398b3c59b" defer></script></head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="./" aria-label="返回天笑の窝"><img src="assets/site-icons/cat-face-e758088f6eb0.svg" width="36" height="36" alt=""><span>天笑の窝</span></a><span class="header-divider"></span><h1>游戏投票</h1><div class="header-actions"><span id="accountName">正在读取账号</span><button id="theme" type="button" aria-label="切换日夜模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></svg><span>日夜模式</span></button><a class="back-link" href="./">返回网站 <span aria-hidden="true">↗</span></a></div></div></header>
<main>
<section class="intro" aria-labelledby="pageTitle"><div class="intro-copy"><p class="eyebrow"><span></span> 天笑的游戏票选</p><h2 id="pageTitle">下一款游戏，<br><em>听你的。</em></h2><p class="intro-description">把想玩的游戏带上来，<br class="mobile-break">让每一份期待都有回响。</p><button id="newPoll" type="button" class="primary" hidden><span aria-hidden="true">＋</span> 发起投票</button></div><div class="intro-art" aria-hidden="true"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><svg viewBox="0 0 440 270"><g class="art-ticket"><path d="m272 28 112 24-27 127-112-24 10-47a15 15 0 0 0 6-29Z" fill="#a8d5c3"/><path d="m297 64 45 10m-51 14 45 10m-50 14 23 5" stroke="#244b42" stroke-width="6" stroke-linecap="round"/><circle cx="326" cy="142" r="13" fill="#244b42"/><path d="m320 142 4 5 9-9" fill="none" stroke="#a8d5c3" stroke-width="3"/></g><path d="m95 94 53-19 117 25 44 42 15 62q4 26-21 25-12-1-40-34l-94-20q-38 19-49 13-23-10-17-35Z" fill="#0d1017" opacity=".24" transform="translate(2 15)"/><path d="m86 79 53-19 117 25 44 42 15 62q4 26-21 25-12-1-40-34l-94-20q-38 19-49 13-23-10-17-35Z" fill="#f4aa7d" stroke="#ffcfac" stroke-width="3"/><path d="m139 60 117 25 44 42-137-29-77-19Z" fill="#ffd6ba"/><path d="m115 111 33 7m-13-20-7 33" stroke="#493833" stroke-width="11" stroke-linecap="round"/><circle cx="240" cy="128" r="9" fill="#bd5e3f"/><circle cx="268" cy="134" r="9" fill="#493833"/><circle cx="251" cy="108" r="9" fill="#493833"/><circle cx="257" cy="155" r="9" fill="#bd5e3f"/><circle cx="174" cy="137" r="14" fill="#493833"/><circle cx="207" cy="151" r="14" fill="#493833"/><path d="m181 101 26 6" stroke="#bd5e3f" stroke-width="5" stroke-linecap="round"/><path d="m59 48 0 18m-9-9h18m300 147v18m-9-9h18" stroke="#f4aa7d" stroke-width="3"/><circle cx="77" cy="213" r="5" fill="#a8d5c3"/><circle cx="373" cy="31" r="4" fill="#f4aa7d"/></svg><span class="art-caption">好游戏，值得被选中。</span></div></section>
<div class="how-it-works" aria-label="参与步骤"><div><b>01</b><span>投稿心仪游戏<small>每人一款 · 最多四张图</small></span></div><span class="step-line" aria-hidden="true"></span><div><b>02</b><span>为喜欢的投票<small>单选或多选 · 依活动规则</small></span></div><span class="step-line" aria-hidden="true"></span><div><b>03</b><span>一起揭晓结果<small>让期待汇成下一款游戏</small></span></div></div>
<p id="status" role="status" aria-live="polite"></p><p id="loginHint" class="login-banner" hidden><span>登录后，就能投稿和投票。</span><a href="./">前往登录 <span aria-hidden="true">→</span></a></p>
<form id="createForm" class="panel create-panel" hidden><div class="form-heading"><div><p class="eyebrow">开启新一轮期待</p><h2>发起游戏投票</h2></div><button id="cancelCreate" type="button" class="quiet">取消</button></div><div class="form-grid"><label>投票标题<input id="pollTitle" maxlength="120" placeholder="给这次票选取个名字" required></label><label>可投稿人数<input id="pollLimit" type="number" min="1" max="500" value="20" required></label><label class="full">活动说明<textarea id="pollDescription" maxlength="2000" rows="3" placeholder="介绍这一轮投票的主题或安排"></textarea></label></div><div class="rules-slot"></div><div class="form-footer"><p class="hint">每位用户可投稿一款游戏，由管理员开启投票。</p><button type="submit" id="createSubmit" class="primary">创建并开放投稿</button></div></form>
<div class="workspace"><aside class="activity-sidebar"><div class="section-label"><h2>投票活动 <span id="pollCount">0</span></h2><button id="reloadList" type="button" class="icon-button" aria-label="刷新活动" title="刷新活动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.1 7a8 8 0 0 1 13.4-2L20 7M4 17l1.5 2A8 8 0 0 0 19 17"/></svg></button></div><div id="pollList"></div><p class="sidebar-note">每一次选择，<br>都在靠近你期待的游戏。</p></aside><section id="detail" aria-live="polite"><div class="empty"><p>正在读取投票活动…</p></div></section></div>
<footer class="page-footer"><a href="./">天笑の窝</a><span>好游戏，一起发现。</span></footer>
</main>
<template id="emptyTemplate"><div class="empty-state"><div class="empty-art" aria-hidden="true"><svg viewBox="0 0 180 140"><path d="m45 41 86 14-12 68-86-15Z" fill="currentColor" opacity=".12"/><path d="m57 21 86 14-14 83-86-15Z" fill="var(--surface)" stroke="currentColor" stroke-width="2"/><path d="m73 48 44 7m-47 10 35 6m-38 11 20 3" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".5"/><circle cx="127" cy="99" r="24" fill="var(--accent)"/><path d="m116 99 7 7 14-16" stroke="var(--accent-ink)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 33h14m-7-7v14m120 7h10m-5-5v10" stroke="currentColor" stroke-width="2"/></svg></div><p class="eyebrow">期待，正在酝酿</p><h2 class="empty-title">下一场票选，敬请期待</h2><p class="empty-description">管理员还没有发起投票。<br>活动开启后，你可以带上喜欢的游戏，和大家一起选。</p><a class="empty-back" href="./">先去发现游戏 <span aria-hidden="true">→</span></a></div></template>
<template id="rulesTemplate"><fieldset class="vote-rules"><legend>投票规则</legend><label>选择方式<select name="choiceMode"><option value="single">单选</option><option value="multiple">多选</option></select></label><div class="choice-bounds" hidden><label>最少选择几款<input name="minChoices" type="number" min="1" max="500" value="1" required></label><label>最多选择几款<input name="maxChoices" type="number" min="1" max="500" value="1" required></label></div><label class="check-label"><input name="allowChange" type="checkbox" checked>允许改投或撤回</label><label>结果公开时机<select name="resultsVisibility"><option value="always">始终公开</option><option value="after_vote">投票后可见，结束后公开</option><option value="after_close">结束后公开</option></select></label><label>投票截止时间（本地时间，可留空）<input name="endsAt" type="datetime-local"></label><p class="rules-lock hint" hidden>已有用户投票，选择数量、改投和结果公开规则已锁定；仍可调整截止时间或结束活动。</p></fieldset></template>
<template id="detailTemplate"><div class="poll-heading panel"><div><span class="phase"></span><h2 class="title"></h2><p class="description"></p><p class="meta"></p><p class="rule-summary"></p><p class="deadline" role="status"></p></div><button class="reload" type="button">刷新</button></div>
<form class="manage panel" hidden><details><summary><span><span class="admin-dot"></span>活动管理</span><span class="summary-note">规则与阶段 <span aria-hidden="true">＋</span></span></summary><div class="manage-fields"><h3>管理投票</h3><label>可投稿人数<input name="limit" type="number" min="1" max="500" required></label><label>当前阶段<select name="phase"><option value="submission">征集投稿</option><option value="voting">开放投票</option><option value="closed">已结束</option></select></label><div class="rules-slot"></div><p class="hint">开始投票时，候选游戏数须达到最少选择数量。已有投票后不能重开投稿；结束后可重新开放投票。</p><button type="submit">保存投票设置</button></div></details></form>
<form class="nominate panel" hidden><div class="form-heading"><div><p class="eyebrow">把你的心愿加入候选</p><h3>投稿一款游戏</h3></div><span class="form-badge">每人一款</span></div><label>游戏名称<input name="title" maxlength="120" placeholder="输入完整游戏名称" required></label><label class="upload-zone">游戏图片（1–4张）<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="submission-previews"></div><p class="image-count hint">已选0/4张，可分次添加</p><p class="hint">支持JPG、PNG、WebP，每张自动压缩上传，保持原始比例。每人一款，同名游戏不能重复投稿。</p><button type="submit" class="primary">提交游戏</button></form>
<div class="candidates-heading"><h3>候选游戏 <span class="entry-count"></span></h3><p class="participation"></p></div><p class="result-notice hint"></p><form class="vote-form"><div class="entries"></div><div class="ballot-actions" hidden><p class="selection-count" role="status"></p><div class="actions"><button class="submit-ballot primary" type="submit">提交投票</button><button class="withdraw-ballot" type="button" hidden>撤回投票</button></div><p class="hint">勾选后点击“提交投票”才会记录。</p></div></form></template>
<dialog id="imageDialog" aria-label="游戏图片预览"><div class="image-dialog-heading"><span id="imageCaption"></span><button id="closeImage" type="button" aria-label="关闭图片预览">×</button></div><img id="largeImage" alt=""><div class="image-navigation"><button id="previousImage" type="button">上一张</button><button id="nextImage" type="button">下一张</button></div></dialog>
</body></html>
