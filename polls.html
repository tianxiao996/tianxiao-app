<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://api.tian-xiao.com blob:; connect-src 'self' https://api.tian-xiao.com; object-src 'none'; base-uri 'self'; form-action 'none'"><title>游戏投票 · 天笑の窝</title><link rel="icon" href="assets/site-icons/cat-face-e758088f6eb0.svg" type="image/svg+xml"><link rel="stylesheet" href="polls.css?v=57b94f65230ac3a2"><script src="polls.js?v=5d767c4e6926ca43" defer></script></head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="./" aria-label="返回天笑の窝"><img src="assets/site-icons/cat-face-e758088f6eb0.svg" width="36" height="36" alt=""><span>天笑の窝</span></a><span class="header-divider"></span><h1>游戏投票</h1><div class="header-actions"><span id="accountName">正在读取账号</span><button id="theme" class="header-icon-btn" type="button" aria-label="切换至夜间模式" title="夜间模式"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button><a class="back-link" href="./">返回网站 <span aria-hidden="true">↗</span></a></div></div></header>
<main>
<section id="pollCarousel" class="poll-carousel" role="region" aria-roledescription="轮播图" aria-label="投票轮播图" tabindex="0" hidden>
<div class="carousel-visual"><img id="pollCarouselImage" alt="投票轮播图" hidden><p id="carouselHint" class="carousel-hint">暂无轮播图</p></div>
<button id="carouselPrevious" class="carousel-arrow" type="button" aria-label="上一张轮播图" hidden>‹</button><button id="carouselNext" class="carousel-arrow" type="button" aria-label="下一张轮播图" hidden>›</button>
<div class="carousel-bottom"><div id="carouselTools" class="carousel-tools" hidden><button id="carouselNew" type="button">新增</button><button id="carouselDelete" type="button">删除</button><button id="carouselUpload" type="button">上传</button></div><div class="carousel-indicators"><div id="carouselDots" class="carousel-dots"></div><span id="carouselPosition">0 / 0</span></div></div>
<input id="carouselFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
</section>
<button id="newPoll" type="button" class="primary" hidden>发起投票</button>
<p id="status" role="status" aria-live="polite"></p><p id="loginHint" class="login-banner" hidden><span>登录后，就能投稿和投票。</span><a href="./">前往登录 <span aria-hidden="true">→</span></a></p>
<form id="createForm" class="panel create-panel" hidden><div class="form-heading"><div><h2>发起游戏投票</h2></div><button id="cancelCreate" type="button" class="quiet">取消</button></div><div class="form-grid"><label>投票标题<input id="pollTitle" maxlength="120" placeholder="输入投票标题" required></label><label>可投稿人数<input id="pollLimit" type="number" min="1" max="500" value="20" required></label><label class="full">活动说明<textarea id="pollDescription" maxlength="2000" rows="3" placeholder="介绍这一轮投票的主题或安排"></textarea></label></div><div class="rules-slot"></div><div class="form-footer"><p class="hint">每位用户可投稿一款游戏，由管理员开启投票。</p><button type="submit" id="createSubmit" class="primary">创建并开放投稿</button></div></form>
<div class="workspace"><aside class="activity-sidebar"><div class="section-label"><h2>投票活动 <span id="pollCount">0</span></h2><button id="reloadList" type="button" class="icon-button" aria-label="刷新活动" title="刷新活动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.1 7a8 8 0 0 1 13.4-2L20 7M4 17l1.5 2A8 8 0 0 0 19 17"/></svg></button></div><div id="pollList"></div></aside><section id="detail" aria-live="polite"><div class="empty"><p>正在读取投票活动…</p></div></section></div>

</main>
<template id="emptyTemplate"><div class="empty-state"><h2 class="empty-title">暂无投票活动</h2><p class="empty-description">管理员发起投票后会显示在这里。</p></div></template>
<template id="rulesTemplate"><fieldset class="vote-rules"><legend>投票规则</legend><label>选择方式<select name="choiceMode"><option value="single">单选</option><option value="multiple">多选</option></select></label><div class="choice-bounds" hidden><label>最少选择几款<input name="minChoices" type="number" min="1" max="500" value="1" required></label><label>最多选择几款<input name="maxChoices" type="number" min="1" max="500" value="1" required></label></div><label class="check-label"><input name="allowChange" type="checkbox" checked>允许改投或撤回</label><label>结果公开时机<select name="resultsVisibility"><option value="always">始终公开</option><option value="after_vote">投票后可见，结束后公开</option><option value="after_close">结束后公开</option></select></label><label>投票截止时间（本地时间，可留空）<input name="endsAt" type="datetime-local"></label><p class="rules-lock hint" hidden>已有用户投票，选择数量、改投和结果公开规则已锁定；仍可调整截止时间或结束活动。</p></fieldset></template>
<template id="detailTemplate"><div class="poll-heading panel"><div><span class="phase"></span><h2 class="title"></h2><p class="description"></p><p class="meta"></p><p class="rule-summary"></p><p class="deadline" role="status"></p></div><button class="reload" type="button">刷新</button></div>
<form class="manage panel" hidden><details><summary><span><span class="admin-dot"></span>活动管理</span><span class="summary-note">规则与阶段 <span aria-hidden="true">＋</span></span></summary><div class="manage-fields"><h3>管理投票</h3><label>可投稿人数<input name="limit" type="number" min="1" max="500" required></label><label>当前阶段<select name="phase"><option value="submission">征集投稿</option><option value="voting">开放投票</option><option value="closed">已结束</option></select></label><div class="rules-slot"></div><p class="hint">开始投票时，候选游戏数须达到最少选择数量。已有投票后不能重开投稿；结束后可重新开放投票。</p><button type="submit">保存投票设置</button></div></details></form>
<form class="nominate panel" hidden><div class="form-heading"><div><h3>投稿一款游戏</h3></div><span class="form-badge">每人一款</span></div><label>游戏名称<input name="title" maxlength="120" placeholder="输入完整游戏名称" required></label><label class="upload-zone">游戏图片（1–4张）<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="submission-previews"></div><p class="image-count hint">已选0/4张，可分次添加</p><p class="hint">支持JPG、PNG、WebP，每张自动压缩上传，保持原始比例。每人一款，同名游戏不能重复投稿。</p><button type="submit" class="primary">提交游戏</button></form>
<div class="candidates-heading"><h3>候选游戏 <span class="entry-count"></span></h3><p class="participation"></p></div><p class="result-notice hint"></p><form class="vote-form"><div class="entries"></div><div class="ballot-actions" hidden><p class="selection-count" role="status"></p><div class="actions"><button class="submit-ballot primary" type="submit">提交投票</button><button class="withdraw-ballot" type="button" hidden>撤回投票</button></div><p class="hint">勾选后点击“提交投票”才会记录。</p></div></form></template>
<dialog id="imageDialog" aria-label="游戏图片预览"><div class="image-dialog-heading"><span id="imageCaption"></span><button id="closeImage" type="button" aria-label="关闭图片预览">×</button></div><img id="largeImage" alt=""><div class="image-navigation"><button id="previousImage" type="button">上一张</button><button id="nextImage" type="button">下一张</button></div></dialog>
</body></html>
